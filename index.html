const PI=Math.PI;
/* 실측 기준: 홈~중앙 펜스 122m, 좌우 펜스 99m, 지붕 높이 67.59m (서울시 발표). 원점=마운드 근처, 홈플레이트 z=+28, 외야=-z */
const G={secs:20,arc:[5*PI/6,4*PI/3],steps:6,stepR:1.7,stepH:0.9,home:28,roofH:67.6,

const H={w:14,d:22,h:6.5,stage:{z:-9.5,w:11,d:3,h:0.9},zones:[{id:'앞쪽',z0:-8,z1:-3.5},{id:'가운데',z0:-3.5,z1:2.5},{id:'뒤쪽',z0:2.5,z1:7.5}]};
const P3=(r,phi,y)=>[r*Math.cos(phi),y,-r*Math.sin(phi)];
const secMid=i=>G.arc[0]+(i+0.5)*G.arc[1]/G.secs;
function parseSec(id){id=String(id);const g=G.ground.find(b=>b.id===id);if(g)return {ground:g};
 const n=parseInt(id,10);const f=Math.floor(n/100),i=n%100-1;if(f>=1&&f<=4&&i>=0&&i<G.secs)return {f,i};return null;}
function secLabel(id){if(H.zones.some(z=>z.id===id))return `스탠딩 ${id}`;const p=parseSec(id);if(!p)return id;return p.ground?p.ground.name:`${p.f}층 ${id}구역`;}
function rowStep(row){if(!row)return 3;const c=String(row).toUpperCase().charCodeAt(0)-65;return Math.max(0,Math.min(G.steps-1,Math.floor(c/4)));}
function seatPose(venue,id,height=1.65,row=null){
 if(venue==='rolling'){const z=H.zones.find(z=>z.id===id)||H.zones[0];return {pos:[0,height-0.12,(z.z0+z.z1)/2],target:[0,2.3,H.stage.z]};}
 const p=parseSec(id);const tgt=[0,8,G.stage.z-4];
 if(!p)return {pos:[0,40,60],target:tgt};
 if(p.ground){const gx=p.ground.x===0?5.5:p.ground.x;return {pos:[gx,1.6,p.ground.z+5.5],target:[0,4,G.stage.z-6]};}
 const F=G.floors[p.f-1],k=row==null?3:rowStep(row),r=F.r0+(k+0.5)*G.stepR;
 return {pos:P3(r,secMid(p.i),F.y0+(k+1)*G.stepH+1.15),target:tgt};}
function stageDist(venue,id,row=null){const p=seatPose(venue,id,1.65,row).pos;const s=venue==='rolling'?[0,H.stage.h,H.stage.z+H.stage.d/2]:[0,G.stage.h,G.stage.z+G.stage.d/2];return Math.round(Math.hypot(p[0]-s[0],p[1]-s[1],p[2]-s[2]));}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function lam(c,o={}){return new THREE.MeshLambertMaterial(Object.assign({color:c,side:THREE.DoubleSide},o));}
function lights(scene){scene.add(new THREE.HemisphereLight(0xffffff,0x3a3a3a,0.9));const d=new THREE.DirectionalLight(0xffffff,0.5);d.position.set(30,90,50);scene.add(d);}
function crowd(scene,areas,seed,{gap=0.8,hmin=1.5,hmax=1.85,avoid=null,y=0}={}){
 const R=rng(seed);const pts=[];
 for(const a of areas){for(let x=a.x0+gap/2;x<a.x1;x+=gap)for(let z=a.z0+gap/2;z<a.z1;z+=gap){const px=x+(R()-.5)*gap*.4,pz=z+(R()-.5)*gap*.4;if(avoid&&Math.hypot(px-avoid[0],pz-avoid[2])<1.6)continue;pts.push([px,pz,hmin+R()*(hmax-hmin)]);}}
 const im=new THREE.InstancedMesh(new THREE.BoxGeometry(0.34,1,0.22),lam(0x2a2a2a),pts.length);
 const o=new THREE.Object3D();pts.forEach((p,i)=>{o.position.set(p[0],y+p[2]/2,p[1]);o.scale.set(1,p[2],1);o.updateMatrix();im.setMatrixAt(i,o.matrix);});
 scene.add(im);return im;}
function screenMat(){return new THREE.MeshBasicMaterial({color:0xe9e9e9,side:THREE.DoubleSide});}
function label(text,{dark=false,w=128}={}){
 const c=document.createElement('canvas');c.width=w*2;c.height=96;const x=c.getContext('2d');
 x.fillStyle=dark?'#0a0a0a':'#fafafa';const r=40;x.beginPath();x.moveTo(r,4);x.arcTo(c.width-4,4,c.width-4,92,r);x.arcTo(c.width-4,92,4,92,r);x.arcTo(4,92,4,4,r);x.arcTo(4,4,c.width-4,4,r);x.fill();
 x.fillStyle=dark?'#fafafa':'#0a0a0a';x.font='700 44px "Noto Sans KR", sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,c.width/2,50);
 const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.renderOrder=10;s.userData.aspect=c.width/c.height;return s;}

function buildBowl(scene,{hi=null,avoid=null}={}){
 lights(scene);
 const field=new THREE.Mesh(new THREE.CircleGeometry(100,64),lam(0x343434));field.rotation.x=-PI/2;scene.add(field);
 const dome=new THREE.Mesh(new THREE.SphereGeometry(106,48,16,0,PI*2,0,PI/2),new THREE.MeshBasicMaterial({color:0x1b1b1b,side:THREE.BackSide}));dome.scale.y=G.roofH/106;scene.add(dome);
 const wire=new THREE.Mesh(new THREE.SphereGeometry(105.5,24,8,0,PI*2,0,PI/2),new THREE.MeshBasicMaterial({color:0x2e2e2e,wireframe:true}));wire.scale.y=G.roofH/105.5;
 const turf=new THREE.Mesh(new THREE.CircleGeometry(99,48,PI*1.25,PI*0.5),lam(0x2f3a30));turf.rotation.x=-PI/2;turf.position.set(0,0.015,G.home);scene.add(turf);scene.add(wire);
 const S=G.stage;const st=new THREE.Mesh(new THREE.BoxGeometry(S.w,S.h,S.d),lam(0x2a2a2a));st.position.set(0,S.h/2,S.z);scene.add(st);
 const back=new THREE.Mesh(new THREE.PlaneGeometry(32,13),screenMat());back.position.set(0,12,S.z-S.d/2-0.5);scene.add(back);
 for(const sx of [-27,27]){const sc=new THREE.Mesh(new THREE.PlaneGeometry(10,6.5),screenMat());sc.position.set(sx,13,S.z-2);scene.add(sc);}
 const tp=new THREE.Mesh(new THREE.BoxGeometry(6,S.h,30),lam(0x2a2a2a));tp.position.set(0,S.h/2,S.z+S.d/2+15);scene.add(tp);
 const truss=new THREE.Mesh(new THREE.BoxGeometry(44,0.6,0.6),lam(0x555555));truss.position.set(0,20,S.z+2);scene.add(truss);
 const secMats={},floorObjs={1:[],2:[],3:[],4:[]};
 for(const b of G.ground){const m=lam(hi===b.id?0xf0f0f0:0x4a4a4a,{transparent:true});secMats[b.id]=[m];const pl=new THREE.Mesh(new THREE.PlaneGeometry(b.w,b.d),m);pl.rotation.x=-PI/2;pl.position.set(b.x,0.03,b.z);scene.add(pl);floorObjs[1].push(pl);}
 crowd(scene,G.ground.map(b=>({x0:b.x-b.w/2,x1:b.x+b.w/2,z0:b.z-b.d/2,z1:b.z+b.d/2})).flatMap(a=>a.x0<3&&a.x1>-3&&a.z0<-48?[{...a,x1:-3.5},{...a,x0:3.5}]:[a]),7,{avoid});
 const [a0,al]=G.arc;

  const faceH=F.f===1?F.y0+0.6:2.6;

  for(let k=0;k<G.steps;k++){const r=F.r0+k*G.stepR,y=F.y0+k*G.stepH;
   const riser=new THREE.Mesh(new THREE.CylinderGeometry(r,r,G.stepH,96,1,true,a0+PI/2,al),lam(0x3f3f3f,{transparent:true}));riser.position.y=y+G.stepH/2;scene.add(riser);floorObjs[F.f].push(riser);}
  for(let i=0;i<G.secs;i++){const id=String(F.f*100+i+1);const sel=hi===id;
   const m=lam(sel?0xb8b8b8:(i%2?0x707070:0x7b7b7b),{transparent:true});secMats[id]=[m];
   const a=a0+i*al/G.secs,len=al/G.secs-0.006;

    const tr=new THREE.Mesh(new THREE.RingGeometry(r,r+G.stepR,6,1,a,len),m);tr.rotation.x=-PI/2;tr.position.y=y;tr.userData.floor=F.f;scene.add(tr);floorObjs[F.f].push(tr);}}}

function mountSeatView(el,{venue,sec,height=1.65,row=null}){
 if(!has3D()){el.innerHTML='<div class="msg">3D 모형을 불러오지 못했어요. 네트워크를 확인해 주세요</div>';return null;}
 const W=el.clientWidth||350,Hh=el.clientHeight||270;
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.setSize(W,Hh);el.prepend(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x121212);
 const camera=new THREE.PerspectiveCamera(62,W/Hh,0.05,600);
 let pose=seatPose(venue,sec,height,row);
 (venue==='rolling'?buildHall:buildBowl)(scene,{hi:sec,avoid:pose.pos});
 let yaw=0,pitch=0,fov=62;const up=new THREE.Vector3(0,1,0);
 function draw(){camera.position.set(...pose.pos);camera.lookAt(...pose.target);camera.rotateOnWorldAxis(up,yaw);camera.rotateX(pitch);camera.fov=fov;camera.updateProjectionMatrix();renderer.render(scene,camera);}
 const pts=new Map();let pinch0=0,fov0=fov;
 const cv=renderer.domElement;
 const down=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const [a,b]=[...pts.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);fov0=fov;}};
 const move=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
  if(pts.size===2){pts.set(e.pointerId,[e.clientX,e.clientY]);const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);fov=Math.max(22,Math.min(75,fov0*pinch0/Math.max(d,1)));draw();return;}
  yaw=Math.max(-1.3,Math.min(1.3,yaw+(e.clientX-p[0])*0.005));pitch=Math.max(-0.55,Math.min(0.55,pitch+(e.clientY-p[1])*0.004));pts.set(e.pointerId,[e.clientX,e.clientY]);draw();};
 const upE=e=>{pts.delete(e.pointerId);};

 cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',upE);cv.addEventListener('pointercancel',upE);cv.addEventListener('wheel',wheel,{passive:false});
 const ro=new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;draw();});ro.observe(el);

sight:()=>{const sh=show();const hall=standing();const vkey=S.venue;
 const pub=id=>S.posts.filter(p=>p.status==='공개'&&(p.venue||'gocheok')===vkey&&(p.sec||p.zone)===id).length;
 const cnt=id=>seedReviews(id).length+pub(id);
 const cls=id=>{const n=cnt(id);return n>=5?'c2':n>=1?'c1':'c0';};
 const my=mySec();
 let svg;
 if(hall){const Wd=H.w,y0=H.stage.z-H.stage.d/2-1;
  svg=`<svg viewBox="${-Wd/2-1} ${y0} ${Wd+2} ${H.d/2-y0+1}" role="img" aria-label="홍대 롤링홀 스탠딩 구역도">
   <rect x="${-H.stage.w/2}" y="${H.stage.z-H.stage.d/2}" width="${H.stage.w}" height="${H.stage.d}" rx="0.6" fill="var(--inv)"/><text x="0" y="${H.stage.z+0.5}" text-anchor="middle" font-size="1.4" class="lab on">무대</text>
   ${H.zones.map(z=>`<rect class="sec ${ui.sec===z.id?'sel':cls(z.id)}" data-sec="${z.id}" x="${-Wd/2+0.5}" y="${z.z0+0.1}" width="${Wd-1}" height="${z.z1-z.z0-0.2}" rx="0.6"/><text x="0" y="${(z.z0+z.z1)/2+0.5}" text-anchor="middle" font-size="1.3" class="lab ${ui.sec===z.id?'on':''}">${z.id}</text>`).join('')}
   <rect x="${-Wd/2+0.5}" y="9.6" width="${Wd-1}" height="3" rx="0.6" fill="var(--muted)"/><text x="0" y="11.5" text-anchor="middle" font-size="1.1" fill="var(--ts)">입구, 바, 물품보관</text></svg>`;}
 else{const fl=ui.floor;const Rm=G.floors[3].r0+G.steps*G.stepR+2;
  let s=`<svg viewBox="${-Rm} -94 ${Rm*2} ${Rm+96}" role="img" aria-label="고척스카이돔 좌석 구조도">`;
  s+=`<rect x="${-G.stage.w/2}" y="${G.stage.z-G.stage.d/2}" width="${G.stage.w}" height="${G.stage.d}" rx="1.5" fill="var(--inv)"/><text x="0" y="${G.stage.z+1.6}" text-anchor="middle" font-size="5" class="lab on">무대</text>`;
  for(const b of G.ground){const on=fl===0;s+=`<rect class="sec ${ui.sec===b.id?'sel':cls(b.id)} ${on?'':'dim'} ${my===b.id?'mine':''}" data-sec="${b.id}" x="${b.x-b.w/2}" y="${b.z-b.d/2}" width="${b.w}" height="${b.d}" rx="1.2"/>`;if(on)s+=`<text x="${b.x}" y="${b.z+1.5}" text-anchor="middle" font-size="4" class="lab ${ui.sec===b.id?'on':''}">${b.id.slice(1)}</text>`;}
  for(const F of G.floors){const on=fl===F.f;const r0=F.r0,r1=F.r0+G.steps*G.stepR;
   for(let i=0;i<G.secs;i++){const id=String(F.f*100+i+1);const a=G.arc[0]+i*G.arc[1]/G.secs,b=a+G.arc[1]/G.secs;
    s+=`<path class="sec ${ui.sec===id?'sel':cls(id)} ${on?'':'dim'} ${my===id?'mine':''}" data-sec="${id}" d="${arcPath(r0,r1,a,b)}"><title>${F.f}층 ${id}구역</title></path>`;
    if(on){const m=(a+b)/2,rm=(r0+r1)/2;s+=`<text x="${(rm*Math.cos(m)).toFixed(1)}" y="${(-rm*Math.sin(m)+1.6).toFixed(1)}" text-anchor="middle" font-size="4.4" class="lab ${ui.sec===id?'on':''}">${id}</text>`;}}}
  svg=s+'</svg>';}
 const sel=ui.sec&&(hall?H.zones.some(z=>z.id===ui.sec):parseSec(ui.sec))?ui.sec:null;
 return hdr('시야')+`<div class="body" style="gap:12px">
  <span class="t-acc">${hall?'홍대 롤링홀 스탠딩 (확장 예시)':esc(sh.name)+' 무대 배치 기준 (엔드 스테이지)'}</span>
  ${hall?'':chips(['플로어','1층','2층','3층','4층'],ui.floor===0?'플로어':ui.floor+'층','floor')}
  <div class="map">${svg}</div>

  ${sel?`<div class="card line" style="gap:10px"><span style="display:flex;align-items:center;gap:8px"><b style="font-size:16px;flex:1">${esc(secLabel(sel))}</b><span class="t-sm">후기 ${cnt(sel)}개</span></span>${tags(secTags(sel))}<span class="t-sm">무대까지 약 ${stageDist(vkey,sel)}m (모형 기준)</span><button class="btn primary" data-act="view" data-s="${esc(sel)}">${ic('eye',18)}&nbsp;이 자리에서 무대 보기</button></div>`
   :`<div class="card"><span class="t-sm">구조도에서 ${hall?'구역':'구역'}을 누르면 그 자리에서 본 무대를 3D로 볼 수 있어요</span></div>`}
  ${my&&!hall?row('내 좌석 바로 보기',S.ticket.floor+' '+S.ticket.zone+'구역 '+S.ticket.row+'열','ticket','myseat'):''}
  ${hall?'':row('내 좌석 시야 등록하기',S.ticket&&S.ticket.verified?'인증된 티켓으로 사진과 평가 올리기':'티켓을 인증한 관람객만 올릴 수 있어요','image','upload')}
  <span class="t-cap">구역 번호, 후기 수, 무대 위치는 예시 데이터예요</span>

function readImg(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,720/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8));};img.src=r.result;};r.readAsDataURL(file);}

 switch(d.act){
  case 'back':back();break;
  case 'browse':stack=['home'];render();break;
  case 'bell':toast(S.ticket?'예매 오픈과 출발 알림을 받고 있어요':'티켓을 등록하면 알림을 받을 수 있어요');break;
  case 'join':S.joined=true;S.nick=S.nick.trim();save();stack=['home'];render();toast(`${S.nick}님, 가입을 마쳤어요`);break;
  case 'register':{saveDraft();const x=S._draft;if(!x.floor||!x.zone||!x.row||!x.no){toast('좌석 정보를 모두 입력해 주세요');return;}
    S.ticket={show:ui.sel,floor:x.floor,zone:x.zone.replace(/[^0-9A-Za-z]/g,''),row:x.row.replace('열',''),no:x.no.replace('번',''),verified:!!ui.img};S.venue='gocheok';
    if(ZONES[S.ticket.zone])ui.zone=S.ticket.zone;save();stack=['home'];render();toast('티켓을 등록했어요');break;}
  case 'alarm':S.alarm=!S.alarm;save();render();toast(S.alarm?'공연 종료 10분 전에 귀가 방법을 알려 드릴게요':'귀가 알림을 껐어요');break;
  case 'write':ui.reviewImg=null;ui.draft='';ui.rating=0;ui.consent=false;ui.tags=new Set();go('upload');break;
  case 'view':ui.sec=d.s;ui.vmode='3d';go('view');break;
  case 'reset3d':R3&&R3.reset();break;
  case 'consent':ui.draft=(document.getElementById('rtext')||{}).value||'';ui.consent=!ui.consent;render();break;
  case 'post':{const txt=document.getElementById('rtext').value.trim()||'한 줄 후기 없음';
    if(!(ui.reviewImg&&ui.rating&&ui.consent)){toast('사진, 별점, 동의가 필요해요');return;}
    const t=S.ticket;const sec=mySec()||String(t.zone);const post={id:Date.now(),venue:'gocheok',sec,zone:sec,seat:`${t.floor} ${t.zone}구역 ${t.row}열`,t:txt,tags:[...ui.tags],img:ui.reviewImg,rating:ui.rating,status:'검수 중'};
    S.posts.unshift(post);save();S.venue='gocheok';ui.sec=sec;ui.vmode='photo';const pp=parseSec(sec);if(pp)ui.floor=pp.ground?0:pp.f;
    stack=['sight','view'];render();toast('AI가 사진을 확인하고 있어요');
    setTimeout(()=>{post.status='공개';save();if(cur()==='view'||cur()==='comm'||cur()==='sight')render();toast('검수를 통과해 시야가 공개됐어요');},1800);break;}
 }
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nick'){const j=app.querySelector('[data-act="join"]');if(!j.disabled)j.click();}});

render();
})();
</script>
